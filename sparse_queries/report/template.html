<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sparse training queries in a D4RT-style model</title>
<style>
  @page { size: A4; margin: 12mm 15mm 11mm 15mm; }
  :root {
    --ink: #1B1F23; --body: #2B3036; --muted: #626A73; --line: #E2E6EB; --tint: #F2F6FA;
    --blue: #0072B2; --green: #009E73; --verm: #D55E00; --amber: #E69F00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: Lora, Georgia, serif; font-size: 9.3pt; line-height: 1.46; color: var(--body); }
  .sans, h1, h2, .kicker, .dek, .link, .tile, .cap, .refs, table, .note { font-family: Poppins, Inter, sans-serif; }
  .page { break-after: page; }
  .page:last-child { break-after: auto; }

  .kicker { font-size: 7.2pt; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--blue); }
  h1 { font-size: 17.5pt; line-height: 1.16; font-weight: 600; color: var(--ink); margin: 1.6mm 0 1.4mm 0; letter-spacing: -0.01em; }
  .dek { font-size: 9.6pt; color: var(--muted); font-weight: 400; margin: 0 0 1mm 0; }
  .link { font-size: 7.6pt; color: var(--muted); }
  .link a { color: var(--blue); text-decoration: none; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3.2mm; margin: 4.2mm 0 1.5mm 0; }
  .tile { background: var(--tint); border-top: 3px solid var(--green); padding: 2.6mm 3.2mm 2.4mm 3.2mm; }
  .tile.bad { border-top-color: var(--verm); }
  .tile.fix { border-top-color: var(--blue); }
  .tile .num { font-size: 19pt; font-weight: 600; line-height: 1.05; color: var(--ink); letter-spacing: -0.01em; }
  .tile .num small { font-size: 9.5pt; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .tile .lab { font-size: 7.6pt; line-height: 1.38; color: var(--body); margin-top: 1.3mm; }

  h2 { font-size: 10.6pt; font-weight: 600; color: var(--ink); margin: 4.4mm 0 1.4mm 0; }
  h2 .n { color: var(--blue); font-weight: 600; margin-right: 1.8mm; }
  p { margin: 0 0 1.6mm 0; }
  ul { margin: 0 0 1.6mm 0; padding-left: 4.2mm; }
  li { margin: 0 0 1.2mm 0; }
  li::marker { color: var(--blue); }
  b { font-weight: 700; color: var(--ink); }
  .q { font-style: italic; color: var(--ink); white-space: nowrap; }

  img { display: block; width: 100%; }
  .cap { font-size: 7.4pt; line-height: 1.4; color: var(--muted); margin: 1.2mm 0 2.6mm 0; }
  .cap b { color: var(--ink); font-weight: 600; }

  .note { font-size: 7.6pt; line-height: 1.4; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 7.8pt; margin: 1mm 0 2.4mm 0; }
  th, td { text-align: left; padding: 1.15mm 2mm 1.15mm 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  sup, sub { line-height: 0; }
  .refs { font-size: 7.3pt; color: var(--muted); line-height: 1.4; margin-top: 2.4mm; }
  tr.base td { color: var(--muted); }
  img.fig2 { width: 100%; margin: 1mm auto 0 auto; }
  .refs p { margin: 0 0 0.8mm 0; }
</style>
</head>
<body>

<section class="page">
  <div class="kicker">Sparse training queries &middot; D4RT-style model</div>
  <h1>Which time-camera combinations does a D4RT-style model need to see?</h1>
  <div class="dek">{{DEK}}</div>
  <div class="link">Code, data and per-run results: <a href="https://github.com/RS-010806/composition/tree/main/sparse_queries">github.com/RS-010806/composition/tree/main/sparse_queries</a></div>

  <div class="tiles">
    {{TILES}}
  </div>

  {{BODY1}}
</section>

<section class="page">
  {{BODY2}}
</section>

</body>
</html>
